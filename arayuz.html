<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D141C">
<title>Otobüsüm Nerede</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#0D141C; --yuzey:#151F2B; --yuzey2:#1B2735; --cizgi:#24313F;
  --ink:#E9EEF4; --ink2:#BCC9D6; --soluk:#8496A9;
  --amber:#F0A63C; --teal:#4EA8B8; --go:#57B37E; --stop:#DE5F5F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:Barlow,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700;
  letter-spacing:.02em;margin:0 0 2px}
.alt{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--soluk)}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

/* arama */
.ara{display:flex;gap:8px;margin:16px 0 10px}
input{flex:1;background:var(--yuzey);border:1px solid var(--cizgi);color:var(--ink);
  border-radius:8px;padding:13px 14px;font-size:16px;font-family:inherit;min-width:0}
input::placeholder{color:var(--soluk)}
button{background:var(--yuzey);border:1px solid var(--cizgi);color:var(--ink);
  border-radius:8px;padding:13px 15px;font-size:15px;font-family:inherit;cursor:pointer;
  white-space:nowrap}
button:active{background:var(--yuzey2)}
button.ana{background:var(--amber);border-color:var(--amber);color:#0D141C;font-weight:600}

/* durak listesi */
.liste{display:flex;flex-direction:column;gap:1px;background:var(--cizgi);
  border:1px solid var(--cizgi);border-radius:10px;overflow:hidden;margin-top:10px}
.durak{background:var(--yuzey);padding:13px 15px;display:flex;justify-content:space-between;
  align-items:center;gap:12px;cursor:pointer}
.durak:active{background:var(--yuzey2)}
.durak-ad{font-weight:500;line-height:1.25}
.durak-alt{font-size:12.5px;color:var(--soluk);margin-top:2px}
/* Durağın gittiği yön — aynı adlı durakları ayıran tek şey (4 Eylül).
   "sefaköy" dört özdeş satır döndürüyordu; yolun iki yakası ayrı duraktır. */
.durak-yon{font-size:11.5px;color:var(--teal);margin-top:3px;font-weight:600;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.uzak{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--teal);white-space:nowrap}

/* durak detayı */
.baslik{display:flex;align-items:flex-start;gap:12px;margin:6px 0 14px}
.geri{background:none;border:none;color:var(--amber);padding:6px 8px 6px 0;font-size:20px}
.hat{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:10px;
  margin-bottom:10px;overflow:hidden}
.hat-ust{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--cizgi)}
.rozet{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;
  background:var(--amber);color:#0D141C;border-radius:5px;padding:3px 9px;line-height:1.15}
.hedef{font-size:14.5px;line-height:1.25;flex:1;min-width:0}
.konum{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--soluk);margin-top:2px}
.varis{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--cizgi)}
.varis:last-child{border-bottom:0}
.ikon{font-size:17px;width:22px;text-align:center;flex:none}
.varis-ic{flex:1;min-width:0}
.varis-ana{font-size:14.5px}
.varis-not{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--soluk);margin-top:2px}
.dk{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:25px;
  text-align:right;line-height:1;white-space:nowrap}
.dk small{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  font-weight:400;letter-spacing:.1em;color:var(--soluk);margin-top:4px}
.canli .dk{color:var(--go)} .canli .ikon{color:var(--go)}
.tarife .dk{color:var(--amber)}
/* ⛔ iptal — kırmızı ve sol şeritli; göz taramada atlamasın diye */
.iptal{border-left:3px solid var(--stop);background:rgba(222,95,95,.07)}
.iptal .ikon{color:var(--stop)}
.iptal .varis-ana{text-decoration:line-through;text-decoration-thickness:1px;opacity:.85}
.dk.iptal-dk{color:var(--stop);font-size:15px;font-weight:700;letter-spacing:.5px}
.gozlem{padding:9px 14px;background:var(--yuzey2);font-size:13px;color:var(--ink2);
  display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--cizgi)}
.bos{text-align:center;color:var(--soluk);padding:34px 16px;font-size:15px}
.hata{background:#3A1E1E;border:1px solid var(--stop);color:#F3C9C9;
  border-radius:8px;padding:12px 14px;font-size:14px;margin-top:12px}
.yenile{text-align:center;color:var(--soluk);font-size:11.5px;
  font-family:"IBM Plex Mono",monospace;margin-top:14px}
</style></head><body>
<div class="wrap">
  <div id="ekran"></div>
</div>

<script>
const E = document.getElementById("ekran");
let zamanlayici = null, aktifDurak = null;

const kaçDk = d => d <= 0 ? "şimdi" : (d < 60 ? d : Math.floor(d/60) + "s " + (d%60));
const esc = s => (s||"").replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

function anaEkran(mesaj) {
  clearInterval(zamanlayici); aktifDurak = null;
  E.innerHTML = `
    <div class="alt">İstanbul · İETT</div>
    <h1>Otobüsüm Nerede</h1>
    <div class="ara">
      <input id="q" placeholder="Durak adı ara…" autocomplete="off" enterkeyhint="search">
      <button id="konum" title="Yakınımdakiler">📍</button>
    </div>
    <div id="sonuc">${mesaj ? `<div class="bos">${esc(mesaj)}</div>` :
      `<div class="bos">Durak adı yaz ya da 📍 ile yakınındakileri bul.</div>`}</div>`;
  const q = document.getElementById("q");
  let bekle;
  q.addEventListener("input", () => {
    clearTimeout(bekle);
    bekle = setTimeout(() => ara(q.value), 280);
  });
  document.getElementById("konum").onclick = yakinBul;
  q.focus();
}

async function ara(metin) {
  if ((metin||"").trim().length < 2) return;
  const s = document.getElementById("sonuc");
  s.innerHTML = `<div class="bos">aranıyor…</div>`;
  try {
    const r = await fetch("/api/ara?q=" + encodeURIComponent(metin));
    listele(await r.json(), s);
  } catch (e) { s.innerHTML = `<div class="hata">Sunucuya ulaşılamadı.</div>`; }
}

function yakinBul() {
  const s = document.getElementById("sonuc");
  if (!navigator.geolocation) { s.innerHTML = `<div class="hata">Konum desteklenmiyor.</div>`; return; }
  s.innerHTML = `<div class="bos">konum alınıyor…</div>`;
  navigator.geolocation.getCurrentPosition(async p => {
    try {
      const r = await fetch(`/api/yakin?e=${p.coords.latitude}&b=${p.coords.longitude}`);
      listele(await r.json(), s, true);
    } catch (e) { s.innerHTML = `<div class="hata">Sunucuya ulaşılamadı.</div>`; }
  }, () => { s.innerHTML = `<div class="hata">Konum izni verilmedi. Durak adıyla arayabilirsin.</div>`; },
     { enableHighAccuracy: true, timeout: 10000 });
}

function listele(liste, hedef, uzaklikGoster) {
  if (!liste || !liste.length) { hedef.innerHTML = `<div class="bos">Durak bulunamadı.</div>`; return; }
  hedef.innerHTML = `<div class="liste">` + liste.map(d => `
    <div class="durak" onclick="durakAc('${d.kod}')">
      <div><div class="durak-ad">${esc(d.ad)}</div>
        <div class="durak-alt">${esc(d.ilce||"")} · ${d.hat_sayisi} hat</div>
        ${d.yonler && d.yonler.length ? `<div class="durak-yon">→ ${esc(d.yonler.join(" · "))}</div>` : ""}</div>
      ${uzaklikGoster ? `<div class="uzak">${d.uzaklik_m} m</div>` : `<div class="uzak">›</div>`}
    </div>`).join("") + `</div>`;
}

async function durakAc(kod) {
  aktifDurak = kod;
  E.innerHTML = `<div class="bos">yükleniyor…</div>`;
  await ciz(kod);
  clearInterval(zamanlayici);
  zamanlayici = setInterval(() => { if (aktifDurak) ciz(aktifDurak, true); }, 30000);
}

async function ciz(kod, sessiz) {
  let v;
  try { v = await (await fetch("/api/durak?kod=" + encodeURIComponent(kod))).json(); }
  catch (e) { if (!sessiz) E.innerHTML = `<div class="hata">Sunucuya ulaşılamadı.</div>`; return; }
  if (v.hata) { E.innerHTML = `<div class="hata">${esc(v.hata)}</div>`; return; }

  const hatlar = v.hatlar.map(h => {
    const varislar = h.varislar.slice(0, 3).map(x => {
      const canli = x.kaynak === "canli";
      // ⛔ İPTAL — tahmin değil, İETT duyurusu (Bölüm 47). Varış saati YOK:
      //    gelmeyecek otobüsün varışı olmaz. Dakika yerine "İPTAL" yazılıyor —
      //    oraya sayı koymak "bu kadar dakika sonra gelecek" demek olurdu.
      if (x.kaynak === "iptal") {
        return `<div class="varis iptal">
          <div class="ikon">⛔</div>
          <div class="varis-ic">
            <div class="varis-ana">İETT ${esc(x.kalkis)} seferini iptal duyurdu</div>
            <div class="varis-not">İETT duyurusu${x.kalkis_yeri
              ? ` · ${esc(x.kalkis_yeri)} kalkışlı` : ""}</div>
          </div>
          <div class="dk iptal-dk">İPTAL</div>
        </div>`;
      }
      return `<div class="varis ${canli ? "canli" : "tarife"}">
        <div class="ikon">${canli ? "🚌" : "⏱"}</div>
        <div class="varis-ic">
          <div class="varis-ana">${canli
            ? `${x.km} km uzakta${x.hiz_kmh ? ` · ${x.hiz_kmh} km/sa` : ""}`
            : `${esc(x.kalkis)} kalkışı → ${esc(x.alt)}–${esc(x.ust)}`}</div>
          <div class="varis-not">${canli ? `araç ${esc(x.arac)} görünüyor` : esc(x.not)}</div>
        </div>
        <div class="dk">${kaçDk(x.dakika)}<small>${x.dakika <= 0 ? "" : "DAKİKA"}</small></div>
      </div>`;
    }).join("");
    // "X dk'da bir geçiyor" yerine yolcunun gerçekte bekleyeceği süre (7 Eylül).
    // Gerekçe: durakta_ne_var.gozlenen_gecisler() — konvoy etkisi.
    const bek = h.gozlem && h.gozlem.bekleme_dk != null
        ? `ortalama <b>${h.gozlem.bekleme_dk} dk</b> beklersin`
        : (h.gozlem ? `bu saatte ortalama <b>${h.gozlem.aralik_dk} dk</b>'da bir geçiyor` : "");
    const g = h.gozlem ? `<div class="gozlem">📊 ${bek}
      ${h.gozlem.son_gecis_dk != null && h.gozlem.son_gecis_dk < 180
        ? `· son geçiş ${h.gozlem.son_gecis_dk} dk önce` : ""}</div>` : "";
    return `<div class="hat">
      <div class="hat-ust">
        <div class="rozet">${esc(h.hat)}</div>
        <div class="hedef">${esc(h.hedef)}
          <div class="konum">${h.sira}/${h.toplam_durak}. durak · rotanın %${h.oran}'i</div></div>
      </div>${g}${varislar || `<div class="varis"><div class="varis-ic"><div class="varis-not">bilgi yok</div></div></div>`}
    </div>`;
  }).join("");

  E.innerHTML = `
    <div class="baslik">
      <button class="geri" onclick="anaEkran()">‹</button>
      <div style="flex:1;min-width:0">
        <h1>${esc(v.ad)}</h1>
        <div class="alt">${esc(v.ilce||"")} · durak ${esc(v.kod)} · ${esc(v.an)}</div>
      </div>
    </div>
    ${hatlar || `<div class="bos">Bu durakta şu an bilgi yok.</div>`}
    <div class="yenile">30 saniyede bir yenilenir · 🚌 canlı · ⏱ tarife+ölçüm</div>`;
}

anaEkran();
</script></body></html>
